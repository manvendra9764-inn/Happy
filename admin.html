<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visitor Dashboard</title>
<style>
body{font-family:Arial,sans-serif;padding:20px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid #ddd;padding:8px;text-align:left}
th{background:#f3f3f3}
</style>
</head>
<body>
<h2>Consent-based visitor information</h2>
<table>
<tr><th>Time (UTC)</th><th>Browser</th><th>Platform</th><th>Screen</th><th>Language</th><th>Timezone</th><th>User Agent</th></tr>
{% for r in rows %}
<tr>
<td>{{r["created_at"]}}</td><td>{{r["browser"]}}</td><td>{{r["platform"]}}</td>
<td>{{r["screen"]}}</td><td>{{r["language"]}}</td><td>{{r["timezone"]}}</td>
<td>{{r["user_agent"]}}</td>
</tr>
{% endfor %}
</table>
</body>
</html>
