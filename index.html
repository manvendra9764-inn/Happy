<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Device Information</title>
<style>
body{font-family:Arial,sans-serif;max-width:600px;margin:60px auto;padding:20px}
button{padding:12px 20px;font-size:16px;cursor:pointer}
.box{padding:18px;border:1px solid #ddd;border-radius:12px}
</style>
</head>
<body>
<div class="box">
<h2>Device information</h2>
<p>This page can collect basic device/browser information after you give permission.
No passwords, photos, contacts, files, or microphone/camera data are requested.</p>
<button id="allow">Allow and continue</button>
<p id="status"></p>
</div>
<script>
function browserName(){
  const ua=navigator.userAgent;
  if(/Edg\//.test(ua)) return "Microsoft Edge";
  if(/Chrome\//.test(ua)) return "Google Chrome";
  if(/Firefox\//.test(ua)) return "Mozilla Firefox";
  if(/Safari\//.test(ua) && !/Chrome\//.test(ua)) return "Safari";
  return "Other";
}
document.getElementById("allow").onclick = async () => {
  const payload = {
    consent: true,
    userAgent: navigator.userAgent,
    platform: navigator.platform || "Unknown",
    browser: browserName(),
    screen: `${screen.width}x${screen.height}`,
    language: navigator.language || "Unknown",
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "Unknown"
  };
  const status=document.getElementById("status");
  try {
    const r=await fetch("/api/visit",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });
    status.textContent = r.ok ? "Information submitted successfully." :
      "Unable to submit information.";
  } catch(e) {
    status.textContent="Unable to connect to the server.";
  }
};
</script>
</body>
</html>
